[project]
name = "general-purpose-ai-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Vinod", email = "abhishekvinod48@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[project.scripts]
general-purpose-ai-chatbot = "general_purpose_ai_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["live: makes real network/API calls; run with -m live"]
addopts = "-m 'not live'"
